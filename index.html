<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050923">
<title>Kingdee · 2026 Countdown</title>
<style>
:root{--blue:#0b8cff;--cyan:#0fd9ff;--violet:#9f63ff;--ink:#050923;--white:#f8fbff}
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0}
body{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--white);background:#03061b;overflow-x:hidden}
.stage{position:relative;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));isolation:isolate;overflow:hidden;background:
radial-gradient(circle at 50% 37%,rgba(16,127,255,.22),transparent 29%),
radial-gradient(circle at 8% 68%,rgba(0,218,255,.12),transparent 26%),
linear-gradient(135deg,#080d31 0%,#04071d 58%,#090a29 100%)}
.grid{position:absolute;inset:0;z-index:-4;opacity:.24;background-image:linear-gradient(rgba(59,133,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(59,133,255,.1) 1px,transparent 1px);background-size:72px 72px;mask-image:linear-gradient(to bottom,transparent,black 18%,black 82%,transparent)}
.speed{position:absolute;inset:0;z-index:-3;overflow:hidden;transform:skewY(-6deg)}
.speed i{position:absolute;left:-45vw;width:44vw;height:2px;border-radius:999px;background:linear-gradient(90deg,transparent,var(--cyan),#fff,transparent);box-shadow:0 0 13px var(--cyan);animation:rush 3s linear infinite;opacity:.48}
.speed i:nth-child(1){top:15%;animation-delay:-.2s}.speed i:nth-child(2){top:27%;animation-delay:-1.4s;width:28vw}.speed i:nth-child(3){top:58%;animation-delay:-2.2s;width:55vw}.speed i:nth-child(4){top:73%;animation-delay:-.8s;width:34vw}.speed i:nth-child(5){top:88%;animation-delay:-1.8s;width:24vw}
@keyframes rush{to{transform:translateX(190vw)}}
.orbit{position:absolute;z-index:-2;width:min(72vw,860px);aspect-ratio:1;border:1px solid rgba(57,183,255,.16);border-radius:50%;box-shadow:0 0 90px rgba(36,133,255,.12),inset 0 0 80px rgba(85,69,255,.06);animation:turn 18s linear infinite}
.orbit:before,.orbit:after{content:"";position:absolute;inset:11%;border-radius:50%;border:1px dashed rgba(139,105,255,.24)}
.orbit:after{inset:29%;border-style:solid;border-color:rgba(0,221,255,.16)}
@keyframes turn{to{transform:rotate(360deg)}}
.dots{position:absolute;inset:0;z-index:-1;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.8px);background-size:113px 97px;opacity:.28;animation:drift 9s linear infinite}
@keyframes drift{to{transform:translate3d(-45px,34px,0)}}
.card{width:min(1020px,100%);min-height:min(820px,calc(100svh - 48px));display:grid;grid-template-rows:auto 1fr auto;gap:26px;text-align:center;padding:clamp(26px,4vw,54px);border:1px solid rgba(139,205,255,.18);border-radius:30px;background:linear-gradient(150deg,rgba(11,18,62,.72),rgba(4,8,31,.38));box-shadow:0 32px 100px rgba(0,0,20,.45),inset 0 1px rgba(255,255,255,.1);backdrop-filter:blur(8px)}
.brand{display:flex;justify-content:center;align-items:center}
.logo{display:block;width:clamp(220px,34vw,430px);height:auto;filter:drop-shadow(0 0 24px rgba(0,156,255,.28))}
.hero{display:flex;flex-direction:column;justify-content:center;align-items:center}
.eyebrow{margin:0 0 9px;color:#a5c8eb;font-size:clamp(12px,1.5vw,16px);font-weight:650;letter-spacing:.38em;text-transform:uppercase}
.year{margin:0;font-size:clamp(66px,12vw,132px);line-height:.88;letter-spacing:-.075em;font-weight:900;background:linear-gradient(105deg,#fff 8%,#5ce1ff 48%,#478cff 72%,#b06cff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px rgba(24,150,255,.35))}
.rule{width:min(470px,72%);height:3px;margin:26px 0 22px;border-radius:999px;background:linear-gradient(90deg,transparent,var(--cyan),#6d7fff,var(--violet),transparent);box-shadow:0 0 16px rgba(42,194,255,.7)}
.days-line{display:flex;align-items:flex-end;justify-content:center;gap:clamp(12px,2.2vw,28px)}
.days{font-variant-numeric:tabular-nums;font-size:clamp(102px,19vw,210px);line-height:.74;font-weight:950;letter-spacing:-.08em;background:linear-gradient(180deg,#fff 0%,#44d8ff 38%,#087ef3 75%,#785bff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 25px rgba(0,180,255,.42));animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{filter:drop-shadow(0 0 38px rgba(0,194,255,.68))}}
.days-copy{text-align:left;padding-bottom:clamp(7px,1.7vw,18px)}
.days-copy strong{display:block;font-size:clamp(24px,4vw,47px);line-height:1;font-weight:900;letter-spacing:.06em}
.days-copy span{display:block;margin-top:8px;color:#93b3d7;font-size:clamp(10px,1.4vw,15px);letter-spacing:.28em}
.subcount{margin-top:25px;color:#b7d3ee;font-size:clamp(11px,1.6vw,17px);font-variant-numeric:tabular-nums;letter-spacing:.18em}
.info{padding-top:25px;border-top:1px solid rgba(108,174,255,.18)}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.info small{display:block;color:#6688b1;font-size:clamp(10px,1vw,13px);font-weight:700;letter-spacing:.24em}
.info b{display:block;margin-top:9px;font-size:clamp(17px,2.3vw,28px);font-weight:600;letter-spacing:.03em;font-variant-numeric:tabular-nums}
.seconds{color:#35dfff;text-shadow:0 0 12px rgba(53,223,255,.8)}
.zone{margin:22px 0 0;color:#6f8db2;font-size:clamp(10px,1.3vw,14px);letter-spacing:.12em}
.live{display:inline-block;width:7px;height:7px;margin-right:8px;border-radius:50%;background:#23e4bb;box-shadow:0 0 11px #23e4bb;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
@media(max-width:620px){
.stage{padding:12px}.card{min-height:calc(100svh - 24px);padding:32px 18px 24px;border-radius:24px;gap:18px}
.logo{width:min(72vw,340px)}.eyebrow{letter-spacing:.25em}.days-line{flex-direction:column;align-items:center;gap:14px}.days-copy{text-align:center;padding:0}.days{font-size:clamp(112px,39vw,180px)}.days-copy strong{font-size:30px}.days-copy span{font-size:11px}.subcount{letter-spacing:.09em}
.info-grid{grid-template-columns:1fr 1fr}.info-grid>div:last-child{grid-column:1/-1;padding-top:13px}.info b{font-size:20px}.info-grid>div:last-child b{font-size:28px}.orbit{width:130vw}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important}}
</style>
</head>

    <div class="hero">
      <p class="eyebrow">Countdown to the end of</p>
      <h1 class="year">2026</h1>
      <div class="rule"></div>
      <div class="days-line">
        <div class="days" id="days">—</div>
        <div class="days-copy"><strong>DAYS TO GO</strong><span>MAKE EVERY DAY COUNT</span></div>
      </div>
      <div class="subcount" id="subcount">— HOURS · — MINUTES · — SECONDS</div>
    </div>
    <footer class="info">
      <div class="info-grid">
        <div><small>TODAY</small><b id="date">—</b></div>
        <div><small>WEEKDAY</small><b id="weekday">—</b></div>
        <div><small>LOCAL TIME</small><b id="time">—</b></div>
      </div>
      <p class="zone"><span class="live"></span><span id="zone">Local time</span></p>
    </footer>
  </section>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2,'0');
  const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Local time';
  const zoneName = new Intl.DateTimeFormat('en-US',{timeZoneName:'longOffset'})
    .formatToParts(new Date()).find(p=>p.type==='timeZoneName')?.value || '';
  function update(){
    const now = new Date();
    const target = new Date(2027,0,1,0,0,0,0);
    const remaining = Math.max(0,target-now);
    const totalSeconds = Math.floor(remaining/1000);
    const days = Math.floor(totalSeconds/86400);
    const hours = Math.floor((totalSeconds%86400)/3600);
    const minutes = Math.floor((totalSeconds%3600)/60);
    const seconds = totalSeconds%60;
    $('days').textContent = days;
    $('subcount').textContent = pad(hours)+' HOURS · '+pad(minutes)+' MINUTES · '+pad(seconds)+' SECONDS';
    $('date').textContent = new Intl.DateTimeFormat('en-CA',{year:'numeric',month:'2-digit',day:'2-digit'}).format(now);
    $('weekday').textContent = new Intl.DateTimeFormat('en-US',{weekday:'long'}).format(now);
    $('time').innerHTML = pad(now.getHours())+':'+pad(now.getMinutes())+':<span class="seconds">'+pad(now.getSeconds())+'</span>';
    $('zone').textContent = timeZone+(zoneName?' ('+zoneName.replace('GMT','GMT')+')':'');
  }
  update(); setInterval(update,250);
})();
</script>
